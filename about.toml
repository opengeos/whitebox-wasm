# cargo-about: the attributions shipped as THIRD-PARTY-NOTICES.txt in the npm
# package, the release assets and the demo site. Covers the crates compiled
# into the two WASM artifacts; scripts/third_party_notices.py adds the rest.
# Keep `accepted` in step with the allow list in deny.toml.
targets = ["wasm32-unknown-unknown", "wasm32-wasip1"]
ignore-dev-dependencies = true
ignore-build-dependencies = true
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "IJG",
    "ISC",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "WTFPL",
    "Zlib",
]
